apiVersion: apps/v1
kind: Deployment
metadata:
  name: mnist-edge-ai

spec:
  replicas: 2

  selector:
    matchLabels:
      app: mnist-edge-ai

  template:
    metadata:
      labels:
        app: mnist-edge-ai
        model-version: baseline-fp32-v1

    spec:
      containers:
        - name: inference
          image: edge-mnist-inference:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: mnist-edge-ai

spec:
  type: ClusterIP

  selector:
    app: mnist-edge-ai

  ports:
    - port: 80
      targetPort: 8080